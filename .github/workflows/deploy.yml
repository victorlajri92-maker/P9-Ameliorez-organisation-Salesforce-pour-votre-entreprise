name: Deploy and Validate Metadata

# Se déclenche automatiquement à chaque push ou pull request sur la branche main
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  sfdxvalidate:
    name: "Run SFDX Validate"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer le CLI Salesforce
        run: npm install -g @salesforce/cli@latest

      # SFDX_AUTH_URL est le secret stocké dans GitHub → Settings → Secrets
      # On utilise printf (pas echo) pour éviter les erreurs sur les caractères spéciaux de l'URL
      - name: Authentification Salesforce
        env:
          SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL }}
        run: |
          printf '%s' "$SFDX_AUTH_URL" > sfdx_auth_url.txt
          sf org login sfdx-url --sfdx-url-file sfdx_auth_url.txt --set-default --alias target-org
          rm sfdx_auth_url.txt

      # Déploie tout le dossier force-app sur Salesforce et lance les tests
      # Ne s'exécute que sur la branche main (pas sur les pull requests)
      - name: Déployer les métadonnées sur Salesforce
        if: github.ref == 'refs/heads/main'
        run: |
          sf project deploy start \
            --source-dir force-app \
            --target-org target-org \
            --test-level RunSpecifiedTests \
            --tests testUpdateAccountCA \
            --tests testCalculMontant \
            --tests testUpdateAllAccounts \
            --tests testMyTeamOrdersController \
            --wait 30
